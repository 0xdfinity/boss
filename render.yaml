# Render blueprint: one web service running both firms.
#
#   https://boss-xxxx.onrender.com        the site
#   https://boss-xxxx.onrender.com/result/<id>   the second firm's deliveries
#
# The second firm runs as a child process inside the same container, with its
# own account and key, listening on loopback. The server proxies only
# /result/<id>, so the deliverable the worker puts on chain has a public URL and
# the client can still check its hash. One service instead of two, one URL.
#
# Secrets are marked `sync: false`, so Render prompts for them instead of
# storing them in this file. The disk keeps the daily demo counters across
# deploys; without it they reset, which can only lower what is allowed.

services:
  - type: web
    name: boss
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: boss-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: BOSS_BIND
        value: 0.0.0.0
      - key: BOSS_TRUST_PROXY
        value: "1"
      - key: BOSS_EMBED_WORKER
        value: "1"
      - key: NEAR_NETWORK
        value: testnet
      - key: NEAR_RPC_URL
        value: https://test.rpc.fastnear.com
      - key: NEAR_USD_RATE
        value: "10"
      # Public URL of this service. The worker advertises it in result_url.
      - key: SITE_URL
        sync: false
      - key: NEAR_ACCOUNT
        sync: false
      - key: NEAR_PRIVATE_KEY
        sync: false
      - key: BOSS_TREASURY_CONTRACT_ID
        sync: false
      - key: BOSS_MARKET_CONTRACT_ID
        sync: false
      - key: BOSS_WORKER_ACCOUNT
        sync: false
      - key: BOSS_WORKER_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: NEAR_AI_API_KEY
        sync: false
      - key: NEAR_AI_MODEL
        sync: false
